services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MongoDB: provisioning only. Reserved for chat/realtime (sub-project #4).
  # No app code connects to it yet — this just puts the container in the
  # infra spine ahead of time.
  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: { context: ., dockerfile: Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    ports: ["3000:3000"]
    volumes:
      - media:/app/media
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      # 127.0.0.1 (not localhost): Next standalone binds IPv4 0.0.0.0 only;
      # in-container "localhost" resolves to ::1 (IPv6) → connection refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ws:
    build: { context: ., dockerfile: Dockerfile.ws }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      WS_PORT: 4000
    ports: ["4000:4000"]
    volumes:
      - media:/app/media
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/socket.io/?EIO=4&transport=polling"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  mongodata:
  media:
